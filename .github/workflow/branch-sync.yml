name: Scheduled Branch Synchronization

on:
  schedule:
    # Runs every 5 minutes
    - cron: '*/5 * * * *'
  workflow_dispatch: # Allows you to run it manually for testing

jobs:
  sync-branches:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Fetches all history for all branches
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      # Step 1: Sync Dev to Staging
      - name: Sync Dev to Staging
        run: |
          git checkout stg
          git merge origin/dev --ff-only || git merge origin/dev --no-edit
          git push origin stg

      # Step 2: Sync Staging to Production
      - name: Sync Staging to Production
        run: |
          git checkout production
          git merge origin/stg --ff-only || git merge origin/stg --no-edit
          git push origin production